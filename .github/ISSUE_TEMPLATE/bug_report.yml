name: Bug report
description: Something behaves incorrectly
labels: [bug]
body:
  - type: input
    id: version
    attributes: { label: Package version, placeholder: 0.1.0 }
    validations: { required: true }
  - type: dropdown
    id: adapter
    attributes:
      label: Storage adapter
      options: [InMemoryStorageAdapter, MongoStorageAdapter, Custom adapter]
    validations: { required: true }
  - type: textarea
    id: what
    attributes: { label: What happened and what did you expect? }
    validations: { required: true }
  - type: textarea
    id: repro
    attributes: { label: Minimal reproduction, render: ts }
  - type: markdown
    attributes:
      value: "Security issues: please do NOT file them here. See SECURITY.md."
